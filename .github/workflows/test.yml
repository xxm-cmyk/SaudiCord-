name: test
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Install native build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libglib2.0-dev

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Format source before validation
              run: pnpm fmt

            - name: Run tests
              run: pnpm test

            - name: Test if it compiles
              run: |
                  pnpm build
                  pnpm build --dev

    test-windows:
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Format source before validation
              run: pnpm fmt

            - name: Run tests
              run: pnpm test

            - name: Add GPL license text to the packaged application
              shell: pwsh
              run: Invoke-WebRequest -Uri https://raw.githubusercontent.com/Vencord/Vesktop/857db4313fbcd79b0946538e68b262033c03f561/LICENSE -OutFile LICENSE -TimeoutSec 60

            - name: Package Windows installer and portable archive
              run: pnpm package:windows
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"

            - name: Upload Windows installer
              uses: actions/upload-artifact@v4
              with:
                  name: SaudiCord-Windows-Installer
                  path: dist/*.exe
                  if-no-files-found: error
                  retention-days: 14

            - name: Upload Windows portable archive
              uses: actions/upload-artifact@v4
              with:
                  name: SaudiCord-Windows-Portable
                  path: dist/*.zip
                  if-no-files-found: error
                  retention-days: 14
