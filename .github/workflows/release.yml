name: Release

on:
    push:
        tags:
            - v*
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Add GPL license text to the packaged application
              shell: pwsh
              run: Invoke-WebRequest -Uri https://raw.githubusercontent.com/Vencord/Vesktop/857db4313fbcd79b0946538e68b262033c03f561/LICENSE -OutFile LICENSE -TimeoutSec 60

            - name: Verify release prerequisites
              shell: pwsh
              run: |
                  if (!(Test-Path LICENSE)) {
                      throw "Release blocked: the required GPL license text is not present."
                  }

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run tests
              run: pnpm test

            - name: Build
              run: pnpm build

            - name: Package and publish Windows installers
              run: pnpm electron-builder --windows --publish always
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"

            - name: Verify auto-update metadata
              shell: pwsh
              run: |
                  if (!(Test-Path dist/latest.yml)) {
                      throw "Release blocked: electron-updater metadata (latest.yml) was not generated."
                  }
